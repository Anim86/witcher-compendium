name: Release Foundry Packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package System
        run: |
          zip -r ../system.zip . -x "*.zip"
          cd ..

      - name: Package Module
        run: |
          cd witcher-compendium
          zip -r ../witcher-compendium-${{ github.ref_name }}.zip . -x "*.zip"
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            system.zip
            witcher-compendium-${{ github.ref_name }}.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
